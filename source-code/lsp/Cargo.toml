[package]
name = "hsharp-lsp"
version = "0.9.0"
edition = "2021"
description = "H# Language Server (LSP) — diagnostics, hover, go-to-definition, completion. Pure Rust, no LLVM dependency (see hsharp-typecheck's doc comment)."

[[bin]]
name = "hsharp-lsp"
path = "src/main.rs"

[dependencies]
hsharp-parser    = { path = "../parser" }
hsharp-typecheck = { path = "../typecheck" }
lsp-server = "0.7"
lsp-types  = "0.95"
serde      = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.108"
anyhow     = "=1.0.79"
