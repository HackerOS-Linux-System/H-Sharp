[package]
name = "hsharp-typecheck"
version = "0.9.0"
edition = "2021"
description = "H# type checker — pure Rust, zero LLVM/native dependencies. Extracted from hsharp-compiler so it can be shared by hsharp-lsp and hsharp-playground (both wasm32-unknown-unknown-compatible) without dragging in inkwell/LLVM."

[lib]
name = "hsharp_typecheck"
path = "src/lib.rs"

[dependencies]
hsharp-parser = { path = "../parser" }
thiserror     = "=1.0.56"
# Only used to read `bytes.lock` (a plain JSON file written by the
# `bytes` package manager) when checking `use "bytes -> pkg"` imports —
# see `bytes_resolve.rs`. Still pure Rust / wasm32-compatible, so this
# doesn't compromise the "zero LLVM/native dependencies" goal in the
# crate description above.
serde_json    = "=1.0.108"
