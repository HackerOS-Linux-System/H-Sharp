name: Tests

# H# jest samodzielnym kompilatorem napisanym w H# (bez cargo/LLVM/interpretera), więc testy też
# są plikami `.h#`: `h# test <PLIK>` kompiluje plik i uruchamia każdą funkcję `#[test]`.
# Kompilator do testów pochodzi z bootstrapu (stage0 z wydania -> stage1 z tych źródeł),
# patrz ./.github/actions/setup-hsharp i ./.github/scripts/build-hsharp.sh.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage0_url:
        description: "URL binarki stage0 `hsharp` (puste = najnowsze wydanie H-Sharp)"
        type: string
        default: ""

env:
  HSHARP_COLOR: "0"

jobs:
  # ── Kompilator z tych źródeł + sprawdzenie składni/typów ──────────────
  build-and-check:
    name: build + check (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Zależności (g++, narzędzia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ curl git ca-certificates

      - name: Stage0 + bit + std
        uses: ./.github/actions/setup-hsharp
        with:
          stage0_url: ${{ inputs.stage0_url || '' }}

      - name: Zbuduj H# ze źródeł (stage1)
        env:
          HSHARP_STAGES: "1"
        run: .github/scripts/build-hsharp.sh dist/hsharp

      - name: h# check — źródła kompilatora i przykłady
        run: |
          set -euo pipefail
          sudo install -m 0755 dist/hsharp /usr/local/bin/hsharp
          sudo ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
          fail=0
          for f in source-code/cli/src/main.h# examples/hello-world.h# examples/hello-edition.h# examples/showcase.h#; do
            echo "::group::h# check $f"
            h# check "$f" || { echo "::error file=$f::h# check nie przeszedł"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail

      - name: h# run / compile — smoke test
        run: |
          echo 'fn main() is write("smoke test ok") end' > /tmp/smoke.h#
          h# run /tmp/smoke.h#
          h# compile /tmp/smoke.h# -o /tmp/smoke
          /tmp/smoke

      - name: Upload kompilator (dla zadania testów)
        uses: actions/upload-artifact@v4
        with:
          name: hsharp-test-compiler
          path: dist/hsharp
          retention-days: 1

  # ── Testy `#[test]` (std, core, parser, typecheck, compiler) ───
  test-suite:
    name: h# test (${{ matrix.group }})
    needs: build-and-check
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [std, core, parser, typecheck, compiler]
    steps:
      - uses: actions/checkout@v4

      - name: Zależności (g++, narzędzia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ curl git ca-certificates

      - uses: actions/download-artifact@v4
        with:
          name: hsharp-test-compiler
          path: dist

      - name: Zainstaluj świeżo zbudowany h# + bit + std
        uses: ./.github/actions/setup-hsharp
        with:
          stage0_url: ${{ inputs.stage0_url || '' }}

      - name: Podmień stage0 na kompilator zbudowany z tych źródeł
        run: |
          sudo install -m 0755 dist/hsharp /usr/local/bin/hsharp
          sudo ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
          h# --version

      - name: h# test (tests/${{ matrix.group }})
        run: |
          set -uo pipefail
          # parser/typecheck/compiler importują `workspace -> ...` i `bit -> ...` — bit install pobiera biblioteki
          bit install || true
          shopt -s globstar nullglob
          fail=0; total=0; failed_files=()
          for f in tests/${{ matrix.group }}/**/*.h#; do
            # tylko pliki z testami (`#[test]`); reszta to pomocnicze skrypty/dumpy
            grep -q '#\[test\]' "$f" || continue
            total=$((total+1))
            echo "::group::h# test $f"
            if ! h# test "$f"; then
              echo "::error file=$f::testy nie przeszły"
              fail=$((fail+1)); failed_files+=("$f")
            fi
            echo "::endgroup::"
          done
          echo "Pliki z testami: $total, nieudane: $fail"
          [ "$total" -gt 0 ] || { echo "::notice::brak plików z #[test] w tests/${{ matrix.group }}"; exit 0; }
          if [ "$fail" -gt 0 ]; then printf ' - %s\n' "${failed_files[@]}"; exit 1; fi

  # ── Packaging scripts — quick sanity build, every push (not just tags) ─
  # Unlike build.yml's `package` job (which only runs on release tags,
  # against a real release binary), this runs on every push/PR against a
  # throwaway stub binary — the goal here is catching a broken
  # build.sh/.spec/PKGBUILD/installer.nsi *syntax* error immediately,
  # without waiting for a release to discover config/packaging/ bit-rotted.
  test-packaging-scripts:
    name: test (packaging scripts, stub binary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build stub binary
        run: |
          echo 'fn main() { println!("stub"); }' > /tmp/stub.rs
          rustc /tmp/stub.rs -o /tmp/hsharp_stub

      - name: Test debian packaging
        run: |
          chmod +x config/packaging/debian/build.sh
          bash config/packaging/debian/build.sh /tmp/hsharp_stub 0.0.0-test amd64
          dpkg-deb --info hsharp_0.0.0-test_amd64.deb

      - name: Test ubuntu packaging
        run: |
          chmod +x config/packaging/ubuntu/build.sh
          bash config/packaging/ubuntu/build.sh /tmp/hsharp_stub 0.0.0-test amd64
          dpkg-deb --info hsharp_0.0.0-test_amd64.deb

      - name: Test fedora .spec (rpmbuild)
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/BUILD ~/rpmbuild/RPMS ~/rpmbuild/SRPMS
          cp /tmp/hsharp_stub ~/rpmbuild/SOURCES/hsharp
          cp LICENSE ~/rpmbuild/SOURCES/LICENSE
          cp config/packaging/fedora/hsharp.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/hsharp.spec

      - name: Test opensuse .spec (rpmbuild)
        run: |
          rm -rf ~/rpmbuild/BUILDROOT ~/rpmbuild/RPMS/*
          cp config/packaging/opensuse/hsharp.spec ~/rpmbuild/SPECS/hsharp_suse.spec
          rpmbuild -bb ~/rpmbuild/SPECS/hsharp_suse.spec

      - name: Test Windows installer script (cross-build with makensis)
        run: |
          sudo apt-get install -y nsis
          mkdir -p /tmp/nsis_src
          cp /tmp/hsharp_stub /tmp/nsis_src/hsharp.exe
          makensis -DVERSION=0.0.0-test -DSRCDIR=/tmp/nsis_src config/packaging/windows/installer.nsi

      - name: Lint PKGBUILD (shellcheck)
        run: shellcheck -s bash config/packaging/arch/PKGBUILD || true # PKGBUILD isn't quite pure bash (makepkg-specific arrays/functions), so this is advisory, not a hard gate
