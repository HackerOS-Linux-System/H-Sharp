name: Build

# Buduje kompilator `hsharp` (alias `h#`) i — na tagach `v*` — pakiety.
#
# H# jest samodzielnym kompilatorem napisanym w H# (generuje C++, buduje go `bit`),
# więc NIE ma już cargo ani LLVM. Do zbudowania źródeł potrzebny jest działający kompilator
# (stage0: gotowa binarka z wydania H-Sharp) + `bit` + g++ — patrz ./.github/actions/setup-hsharp
# i ./.github/scripts/build-hsharp.sh.
#
# Etapy:
#   stage0 (wydanie)  --buduje-->  stage1 (te źródła)  --buduje-->  stage2 (te same źródła)
# Wynikiem jest stage2, czyli kompilator zbudowany samym sobą (test samodzielności).
#
# Zadania:
#   1. `build-native`    — runnery Ubuntu (x86_64)
#   2. `build-container` — Debian / Fedora / Arch / openSUSE w kontenerach (x86_64)
#   3. `build-arm64`     — kompilacja skrośna stage1 -> linux-aarch64 (eksperymentalna, nie blokuje)
#   4. `package`         — pakiety deb/rpm (config/packaging/<dystrybucja>/), tylko na tagach `v*`
#
# Windows i macOS: pominięte — stage0 jest dostępny tylko jako binarka Linux x86_64.
#
# Wyzwalacze: push/PR na main (samo budowanie + smoke test), tag `v*` (budowa + pakiety + wydanie),
# ręcznie (workflow_dispatch; można podać własny URL stage0).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage0_url:
        description: "URL binarki stage0 `hsharp` (puste = najnowsze wydanie H-Sharp)"
        type: string
        default: ""
      stages:
        description: "Ile etapów bootstrapu: 1 = stage1, 2 = stage1 + stage2 (samodzielność)"
        type: choice
        options: ["2", "1"]
        default: "2"

permissions:
  contents: write # publikacja wydania na tagach v*

env:
  STAGE0_URL: ${{ inputs.stage0_url || '' }}
  HSHARP_STAGES: ${{ inputs.stages || '2' }}
  HSHARP_COLOR: "0"

jobs:
  # ── 1. Runnery Ubuntu ─────────────────────────────────────────────────
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            os: ubuntu-22.04
          - name: ubuntu-24.04
            os: ubuntu-24.04
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Zależności (g++, narzędzia)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ curl git ca-certificates

      - name: Stage0 + bit + std
        uses: ./.github/actions/setup-hsharp
        with:
          stage0_url: ${{ env.STAGE0_URL }}

      - name: Zbuduj H# (bit build --release)
        run: .github/scripts/build-hsharp.sh dist/hsharp

      - name: Smoke test (h# run + h# compile)
        run: |
          dist/hsharp --version
          echo 'fn main() is write("smoke test ok") end' > /tmp/smoke.h#
          dist/hsharp run /tmp/smoke.h#
          dist/hsharp compile /tmp/smoke.h# -o /tmp/smoke
          /tmp/smoke

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsharp-${{ matrix.name }}
          path: dist/hsharp
          retention-days: 7

  # ── 2. Kontenery (dystrybucje bez hostowanego runnera) ────────────────
  build-container:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends build-essential g++ curl git ca-certificates
          - name: fedora-40
            image: fedora:40
            install: dnf install -y gcc gcc-c++ make curl git ca-certificates findutils
          - name: fedora-41
            image: fedora:41
            install: dnf install -y gcc gcc-c++ make curl git ca-certificates findutils
          - name: arch
            image: archlinux:latest
            install: pacman -Syu --noconfirm base-devel git curl
          - name: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install gcc gcc-c++ make curl git ca-certificates findutils tar gzip
    name: build (${{ matrix.name }}, container)
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Zależności (g++, narzędzia)
        run: ${{ matrix.install }}

      - uses: actions/checkout@v4

      - name: Stage0 + bit + std
        uses: ./.github/actions/setup-hsharp
        with:
          stage0_url: ${{ env.STAGE0_URL }}

      - name: Zbuduj H# (bit build --release)
        run: .github/scripts/build-hsharp.sh dist/hsharp

      - name: Smoke test (h# run + h# compile)
        run: |
          dist/hsharp --version
          echo 'fn main() is write("smoke test ok") end' > /tmp/smoke.h#
          dist/hsharp run /tmp/smoke.h#
          dist/hsharp compile /tmp/smoke.h# -o /tmp/smoke
          /tmp/smoke

      - name: Upload raw binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: hsharp-${{ matrix.name }}
          path: dist/hsharp
          retention-days: 7

  # ── 3. aarch64 — kompilacja skrośna (eksperymentalna) ────────────────
  build-arm64:
    name: build (linux-aarch64, cross)
    runs-on: ubuntu-24.04
    continue-on-error: true # backend C++ + cross g++; nie blokuje reszty, dopóki nie zostanie sprawdzony
    steps:
      - uses: actions/checkout@v4

      - name: Zależności (g++ + cross g++ aarch64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential g++ g++-aarch64-linux-gnu curl git ca-certificates

      - name: Stage0 + bit + std
        uses: ./.github/actions/setup-hsharp
        with:
          stage0_url: ${{ env.STAGE0_URL }}

      - name: Zbuduj stage1 (x86_64) — kompilator hosta
        env:
          HSHARP_STAGES: "1"
        run: .github/scripts/build-hsharp.sh dist/hsharp-host

      - name: Skompiluj H# dla linux-aarch64
        run: |
          sudo install -m 0755 dist/hsharp-host /usr/local/bin/hsharp
          sudo ln -sf /usr/local/bin/hsharp "/usr/local/bin/h#"
          rm -rf cache
          bit install
          # ten sam wpis co w build-hsharp.sh, tylko z innym celem
          h# compile source-code/cli/src/main.h# --release --target linux-aarch64 -o dist/hsharp-aarch64
          file dist/hsharp-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: hsharp-linux-aarch64
          path: dist/hsharp-aarch64
          retention-days: 7

  # ── 4. Pakiety (tylko na tagach v*) ───────────────────────────────────
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native, build-container]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-12
            artifact: hsharp-debian-12
            packager: debian
            ext: deb
          - name: ubuntu-22.04
            artifact: hsharp-ubuntu-22.04
            packager: ubuntu
            ext: deb
          - name: ubuntu-24.04
            artifact: hsharp-ubuntu-24.04
            packager: ubuntu
            ext: deb
          - name: fedora-40
            artifact: hsharp-fedora-40
            packager: fedora
            ext: rpm
          - name: fedora-41
            artifact: hsharp-fedora-41
            packager: fedora
            ext: rpm
          - name: opensuse-tumbleweed
            artifact: hsharp-opensuse-tumbleweed
            packager: opensuse
            ext: rpm
    name: package (${{ matrix.name }})
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: chmod binary
        run: chmod +x dist/hsharp

      - name: Build .deb
        if: matrix.ext == 'deb'
        run: |
          chmod +x config/packaging/${{ matrix.packager }}/build.sh
          bash config/packaging/${{ matrix.packager }}/build.sh dist/hsharp ${{ steps.ver.outputs.version }} amd64

      - name: Build .rpm
        if: matrix.ext == 'rpm'
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p ~/rpmbuild/SOURCES ~/rpmbuild/SPECS ~/rpmbuild/BUILD ~/rpmbuild/RPMS ~/rpmbuild/SRPMS
          cp dist/hsharp ~/rpmbuild/SOURCES/hsharp
          cp LICENSE ~/rpmbuild/SOURCES/LICENSE
          sed -i "s/^Version:.*/Version:        ${{ steps.ver.outputs.version }}/" config/packaging/${{ matrix.packager }}/hsharp.spec
          cp config/packaging/${{ matrix.packager }}/hsharp.spec ~/rpmbuild/SPECS/
          rpmbuild -bb ~/rpmbuild/SPECS/hsharp.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            *.deb
            *.rpm

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.rpm

  # Surowa binarka `hsharp` + std do wydania (stage2 z Ubuntu 22.04 — najstarsza glibc, najszersza zgodność).
  release-binary:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-native]
    name: release (hsharp binary + std)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hsharp-ubuntu-22.04
          path: dist
      - name: Przygotuj pliki wydania
        run: |
          chmod +x dist/hsharp
          tar -czf dist/hsharp-std.tar.gz std
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hsharp
            dist/hsharp-std.tar.gz
